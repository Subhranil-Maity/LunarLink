[package]
name = "LunarLinkServer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lunar_link"
path = "./src/bin/main.rs"

[lib]
name = "lunar_lib"
path = "./src/lib.rs"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
axum = { version = "0.8.4", features = ["multipart"]}
serde_json = "1.0.142"
serde = { version = "1.0.219", features = ["derive"] }
sys-info = "0.9.1"
tower-http = { version = "0.6.6", features = ["trace", "cors"]}
local-ip-address = "0.6.3"
trash = "5.2.2"
toml = "0.9.5"
tracing-subscriber = "0.3.19"
tracing = "0.1.41"
rand = "0.9.2"
chrono = "0.4.41"
jsonwebtoken = "9.3.1"
http = "1.3.1"
sysinfo = "0.36.1"